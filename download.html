</style></head><body><main class="box"><div class="logo">M O V I X · DOWNLOAD CENTER</div><div class="icon">↓</div><h1 id="heading">Vérification de X-Men…</h1><p>Ton espace de téléchargement MOVIX</p><div id="status" class="status">Vérification du fichier vidéo…</div><button id="download" class="btn" type="button" hidden>↓ Télécharger X-Men</button><div class="links"><a href="detail.html?title=X-Men">← Fiche X-Men</a><a href="index.html">Retour à l’accueil</a></div><p class="foot">Fichier attendu : <code>films/X-Men.mp4</code><br>Utilise uniquement un fichier que tu es autorisé à distribuer.</p></main>
<script>
(()=>{
 const KEY='movix-xmen-download-day';
 const heading=document.getElementById('heading'),status=document.getElementById('status'),btn=document.getElementById('download');
 let ready=false,busy=false;
 function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
 function used(){return localStorage.getItem(KEY)===today();}
 function limit(){ready=false;btn.hidden=true;heading.textContent='Limite quotidienne atteinte';status.textContent='Un téléchargement a déjà été lancé aujourd’hui dans ce navigateur. La limite sera réinitialisée demain.';}
 async function check(){if(used()){limit();return;}busy=true;try{const r=await fetch('films/X-Men.mp4',{method:'HEAD',cache:'no-store'});if(!r.ok)throw Error('missing');if(used()){limit();return;}ready=true;heading.textContent='X-Men est prêt';status.textContent='Fichier détecté. Tu peux lancer ton téléchargement.';btn.hidden=false;}catch(e){heading.textContent='Fichier introuvable';status.innerHTML='Place le fichier autorisé dans le dossier <code>films</code> sous le nom exact <code>X-Men.mp4</code>, puis recharge cette page.';}finally{busy=false;}}
 btn.addEventListener('click',()=>{if(busy||!ready)return;if(used()){limit();return;}localStorage.setItem(KEY,today());limit();const a=document.createElement('a');a.href='films/X-Men.mp4';a.download='X-Men.mp4';document.body.appendChild(a);a.click();a.remove();});
 check();
})();
</script></body></html>
